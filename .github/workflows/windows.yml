# 🚀 Build and check Windows releases before publishing.
name: 🪟 Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: 🏗️ Test, build, and check the installer
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: 📥 Get source
        uses: actions/checkout@v4
      - name: 🐍 Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.lock
      - name: 🏷️ Read the app version
        id: version
        run: |
          $whiteboardVersion = python -c "import sys; sys.path.insert(0, 'build'); from build_utils import app_version; print(app_version())"
          "version=$whiteboardVersion" >> $env:GITHUB_OUTPUT
      - name: 🧩 Install locked packages
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: 🧪 Run tests
        run: python -m pytest -q --junitxml=build/output/test-results.xml
      - name: 🔧 Install the MSI build tools
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: 📦 Build the app and installer
        run: python build/build.py --installer
      - name: 📥 Get the previous verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build/previous | Out-Null
          gh release download v1.0.0 --pattern WhiteBoard-1.0.0-x64.msi --dir build/previous
      - name: ✅ Check upgrade, launch, repair, and uninstall
        run: python build/validate_windows.py --previous-installer build/previous/WhiteBoard-1.0.0-x64.msi
      - name: ⚖️ Collect package licenses
        run: python build/collect_licenses.py
      - name: 🎁 Make the complete release ZIP
        run: python build/package.py --installer
      - name: 📎 Save release files
        uses: actions/upload-artifact@v4
        with:
          name: WhiteBoard-${{ steps.version.outputs.version }}-windows-x64
          path: artifacts/*
          if-no-files-found: error
      - name: 🧾 Save test results and MSI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhiteBoard-windows-validation
          path: build/output/
          if-no-files-found: warn
      - name: 🚀 Publish the tested release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --title "🚀 WhiteBoard ${{ steps.version.outputs.version }}" --notes-file docs/RELEASE_NOTES.md --verify-tag
